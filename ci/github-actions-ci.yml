name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions SETUP.md promises. 3.13 is excluded on purpose: torch
        # 2.3.1 and numpy 1.26.4 publish no wheels for it.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Install the light runtime dependencies
        # Not the full requirements file: torch alone is ~800 MB and none of
        # the tests need a model. These are what the tested modules import.
        run: pip install requests pillow moviepy==1.0.3 imageio-ffmpeg

      - name: Byte-compile everything
        run: python -m compileall -q utility app.py

      - name: Lint for undefined names and unused imports
        run: python -m ruff check .

      - name: Run the tests
        run: python -m pytest tests -q

      - name: Check nothing secret is tracked
        run: |
          if git ls-files --error-unmatch config.json .env 2>/dev/null; then
            echo "::error::A settings file holding API keys is tracked by git."
            exit 1
          fi
          echo "No credential files are tracked."
